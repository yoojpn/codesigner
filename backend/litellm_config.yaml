model_list:
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 1
  cooldown_time: 60
  num_retries: 3

litellm_settings:
  drop_params: true  # Claude Code固有パラメータをOpenRouterに渡さない
  set_verbose: false
